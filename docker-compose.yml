services:
  postgres:
    image: postgres:16-alpine
    container_name: cdmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cdmp_dev
      POSTGRES_USER: cdmp
      POSTGRES_PASSWORD: cdmp_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdmp -d cdmp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 本機 dev 預設 development（synchronize 建表）；正式部署以 shell/.env 設 NODE_ENV=production
      # 關閉 synchronize（schema 改由 baseline migration 提供，見 bootstrap 服務）。
      NODE_ENV: ${NODE_ENV:-development}
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cdmp
      DB_PASSWORD: cdmp_secret
      DB_NAME: cdmp_dev
      JWT_SECRET: ${JWT_SECRET:-cdmp-dev-jwt-secret-key-2026}
      # datasource 密碼加解密金鑰：api/worker/bootstrap 必須共用同一把（否則測試連線解密失敗）
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:-2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2}
      PORT: 3000
      # F050 v2.0 / F075 v1.4 / F076 v1.3 — E07 refactor phase 3 feature flag
      # 受保護端點：F075 寫入 + available-columns / F050 v2.0 草稿 / F076 寫入
      # 預設關閉以支援漸進 rollout（BR-10）；dev 明確啟用以使用 v1.4 dropdown 等功能
      ENABLE_E07_REFACTOR_PHASE3: "true"
      # F084 v2.0 — 個別業務比例完成後自動推進至簽核（AD-E07-19）
      # prod 預設 off（漸進 rollout / BR-16）；dev 明確啟用以測試 auto-advance 主路徑
      ENABLE_E07_AUTO_ADVANCE_TO_APPROVAL: "true"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/test:/app/test
    depends_on:
      postgres:
        condition: service_healthy

  # F098 / AD-E07-28 P1：月跑 worker 容器（pg-boss consumer + cancellation poller + orphan reaper）。
  # 與 api 同一份 apps/api 程式碼（build.context: ./apps/api，避免 entity drift），
  # 共用相同 DB / AES / feature-flag env；worker entrypoint 不掛 HTTP server、不 expose port（AC-8）。
  worker:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-worker
    restart: unless-stopped
    command: npx ts-node -r tsconfig-paths/register src/worker-main.ts
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cdmp
      DB_PASSWORD: cdmp_secret
      DB_NAME: cdmp_dev
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:-2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2}
      # worker 才是真正執行 pipeline 者（AC-8 / TS-F098-WORKER-003）
      ENABLE_E07_REFACTOR_PHASE3: "true"
      ENABLE_E07_AUTO_ADVANCE_TO_APPROVAL: "true"
      # AD-E07-40 P2c DoD #4：mssql 自建佇列輪詢間隔（RunQueueConsumer.startMssqlPolling）。
      #   cutover 前 DB_TYPE=postgres 走 pg-boss、本值不被使用；預留供 mssql cutover 後 prod 可調。
      RUN_QUEUE_POLL_INTERVAL_MS: ${RUN_QUEUE_POLL_INTERVAL_MS:-2000}
      # Bug A 修復（AD-E07-28）：PG 一律走 v2 SQL 下推（gate = DB_TYPE='postgres'）→ 真實計分。
      #   ASSIGNMENT_PIPELINE_V2 對 PG 已無意義（僅非 PG in-memory 路徑用於選 v1/v2），故此處不設。
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/test:/app/test
    depends_on:
      postgres:
        condition: service_healthy
    # 刻意無 ports：worker 不對外提供 HTTP（AC-8 / TS-F098-WORKER-001）

  web:
    build:
      context: ./apps/web
      target: dev
    container_name: cdmp-web
    restart: unless-stopped
    ports:
      # host 對外 port：dev 預設 5174；內網網址部署於 .env 設 WEB_PORT=80（網址免加 port）→ 容器內仍 5173
      - "${WEB_PORT:-5174}:5173"
    environment:
      VITE_API_URL: http://api:3000
      # 內網網址部署：於 .env 設 VITE_ALLOWED_HOSTS=你的網址（多個逗號分隔）；未設則允許全部 host
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./apps/web/src:/app/src
      - ./packages/shared:/packages/shared
    depends_on:
      - api

  # 一鍵部署 bootstrap（冪等）：baseline migration → 帳號(users) → datasource 空殼(9個) → 計分卡/pipeline/擷取任務。
  # 取代舊 seed / data-seed 兩個 profile（已移除）；如需單獨重跑某步，於容器內執行對應 npm script：
  #   docker exec cdmp-api npm run seed            # 只重建測試帳號
  #   docker exec cdmp-api npm run seed-datasource # 只補 datasource 空殼
  #   docker exec cdmp-api npm run data-seed       # 只 reconcile 計分卡 / pipeline / 擷取任務
  # 正式部署（fresh DB）流程：
  #   1) docker compose up -d postgres            # 等 healthy
  #   2) NODE_ENV=production docker compose --profile bootstrap up bootstrap --build --abort-on-container-exit
  #   3) NODE_ENV=production docker compose up -d # 起 api/worker/web（synchronize 已關，schema 來自 migration）
  # datasource 一律建空殼（密碼留空），部署後於 UI「資料來源」逐一補密碼並測試連線。
  bootstrap:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-bootstrap
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cdmp
      DB_PASSWORD: cdmp_secret
      DB_NAME: cdmp_dev
      # 必須與 api/worker 共用同一把（datasource 密碼加密）
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:-2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2}
      # 選填：指定 etl_pipelines/datasource created_by 的 admin email（預設用 seed admin）
      ETL_SEED_USER_EMAIL: ${ETL_SEED_USER_EMAIL:-}
    command: npm run bootstrap
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - bootstrap

  # === MSSQL 遷移 dev DB（P0）===
  # 本機 SQL Server 2022 開發庫：版本對齊 prod（2022），collation=Chinese_Taiwan_Stroke_BIN 對齊來源系統硬性要求。
  # 只在需要時啟動（不影響預設的 postgres dev 流程）：
  #   docker compose --profile mssql up -d mssql mssql-init
  # api/worker 於 P1 接上 mssql driver 分支後才改指向本服務；目前僅供連線 smoke / schema 開發。
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cdmp-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Cdmp_Sa_2026!}
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "Chinese_Taiwan_Stroke_BIN"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    # AD-E07-44 P6a：server 映像不含 sqlcmd，改以 bash /dev/tcp 埠存活探測（liveness）。
    #   真正的「SQL 就緒 + CDMP 庫/login 已建」由 mssql-init 完成（service_completed_successfully）保證，
    #   故 P6a 生產服務（api-mssql/worker-mssql/bootstrap-mssql）依賴 mssql-init 完成而非僅本 healthcheck。
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    profiles:
      # AD-E07-44 P6a：mssql-prod / mssql-bootstrap 也需本服務（生產部署路徑共用同一 mssql 容器）。
      - mssql
      - mssql-prod
      - mssql-bootstrap

  # 一次性 init：等 mssql 起來後建 CDMP 資料庫（BIN collation）+ app 專用 login。
  # 用 mssql-tools18 映像（內含 sqlcmd）；新版 server 映像不再內建 tools，故以本服務的 retry loop 取代 healthcheck。
  mssql-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: cdmp-mssql-init
    depends_on:
      - mssql
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Cdmp_Sa_2026!}
    volumes:
      - ./docker/mssql-init.sql:/init/mssql-init.sql:ro
    entrypoint: ["/bin/bash"]
    command:
      - "-c"
      - >
        for i in {1..60}; do
        /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b >/dev/null 2>&1 && break;
        echo waiting-for-mssql;
        sleep 2;
        done;
        /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -i /init/mssql-init.sql
    profiles:
      # AD-E07-44 P6a：生產部署路徑亦須先跑 init 建庫/login。
      - mssql
      - mssql-prod
      - mssql-bootstrap

  # ==========================================================================
  # === AD-E07-44 P6a：MSSQL 生產部署路徑（additive、profile-gated）===
  # 對齊現行 postgres 版一鍵部署，但 **不翻動 postgres 預設**（分階段：預設切換由 P6b 處理）。
  # 預設 `docker compose up` 完全不受影響；本區塊只有在顯式帶入 profile 時才啟動。
  #
  # 正式部署（fresh MSSQL 庫）流程：
  #   0) cp .env.mssql.example .env  並填入 AES_ENCRYPTION_KEY / JWT_SECRET（見該檔）
  #   1) docker compose --profile mssql-bootstrap up mssql mssql-init --build   # 等 mssql-init 建庫/login
  #   2) docker compose --profile mssql-bootstrap run --rm bootstrap-mssql       # 一鍵 migration+seed（冪等）
  #   3) docker compose --profile mssql-prod up -d                                # 起 api-mssql/worker-mssql/web-mssql
  # 之後於 UI「資料來源」逐一補 datasource 密碼並測試連線 → 觸發 ETL 首次灌入（P6c）。
  #
  # bootstrap 之 npm script 本身依 DB_TYPE 分派（seeds 已 driver-portable，AD-E07-39 P1b3），
  # 故 MSSQL 路徑與 PG 路徑共用同一 `npm run bootstrap`，差異僅在傳入的環境變數。
  # ==========================================================================
  bootstrap-mssql:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-bootstrap-mssql
    environment:
      # 正式部署關 synchronize（schema 由 baseline migration 提供）。
      NODE_ENV: ${NODE_ENV:-production}
      DB_TYPE: mssql
      DB_HOST: mssql
      DB_PORT: 1433
      DB_USERNAME: ${DB_MSSQL_USERNAME:-cdmp}
      DB_PASSWORD: ${DB_MSSQL_PASSWORD:-Cdmp_Dev_2026!}
      DB_NAME: ${DB_MSSQL_NAME:-CDMP}
      DB_MSSQL_ENCRYPT: ${DB_MSSQL_ENCRYPT:-true}
      DB_MSSQL_TRUST_CERT: ${DB_MSSQL_TRUST_CERT:-true}
      # 必須與 api-mssql/worker-mssql 共用同一把（datasource 密碼加解密）。
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:-2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2}
      # 選填：指定 etl_pipelines/datasource created_by 的 admin email（預設用 seed admin）。
      ETL_SEED_USER_EMAIL: ${ETL_SEED_USER_EMAIL:-}
    command: npm run bootstrap
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    profiles:
      - mssql-bootstrap

  api-mssql:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-api-mssql
    restart: unless-stopped
    ports:
      # 預設沿用 3000；與 dev postgres api 並存測試時以 MSSQL_API_PORT 覆寫（如 3100）。
      - "${MSSQL_API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_TYPE: mssql
      DB_HOST: mssql
      DB_PORT: 1433
      DB_USERNAME: ${DB_MSSQL_USERNAME:-cdmp}
      DB_PASSWORD: ${DB_MSSQL_PASSWORD:-Cdmp_Dev_2026!}
      DB_NAME: ${DB_MSSQL_NAME:-CDMP}
      DB_MSSQL_ENCRYPT: ${DB_MSSQL_ENCRYPT:-true}
      DB_MSSQL_TRUST_CERT: ${DB_MSSQL_TRUST_CERT:-true}
      JWT_SECRET: ${JWT_SECRET:-cdmp-dev-jwt-secret-key-2026}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:-2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2}
      PORT: 3000
      ENABLE_E07_REFACTOR_PHASE3: "true"
      ENABLE_E07_AUTO_ADVANCE_TO_APPROVAL: "true"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/test:/app/test
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    profiles:
      - mssql-prod

  worker-mssql:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-worker-mssql
    restart: unless-stopped
    command: npx ts-node -r tsconfig-paths/register src/worker-main.ts
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_TYPE: mssql
      DB_HOST: mssql
      DB_PORT: 1433
      DB_USERNAME: ${DB_MSSQL_USERNAME:-cdmp}
      DB_PASSWORD: ${DB_MSSQL_PASSWORD:-Cdmp_Dev_2026!}
      DB_NAME: ${DB_MSSQL_NAME:-CDMP}
      DB_MSSQL_ENCRYPT: ${DB_MSSQL_ENCRYPT:-true}
      DB_MSSQL_TRUST_CERT: ${DB_MSSQL_TRUST_CERT:-true}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:-2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2}
      ENABLE_E07_REFACTOR_PHASE3: "true"
      ENABLE_E07_AUTO_ADVANCE_TO_APPROVAL: "true"
      # mssql 自建佇列輪詢間隔（RunQueueConsumer.startMssqlPolling；DB_TYPE=mssql 生效）。
      RUN_QUEUE_POLL_INTERVAL_MS: ${RUN_QUEUE_POLL_INTERVAL_MS:-2000}
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/test:/app/test
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    # 刻意無 ports：worker 不對外提供 HTTP（比照 postgres worker）。
    profiles:
      - mssql-prod

  web-mssql:
    build:
      context: ./apps/web
      target: dev
    container_name: cdmp-web-mssql
    restart: unless-stopped
    ports:
      - "${MSSQL_WEB_PORT:-5174}:5173"
    environment:
      VITE_API_URL: http://api-mssql:3000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./apps/web/src:/app/src
      - ./packages/shared:/packages/shared
    depends_on:
      - api-mssql
    profiles:
      - mssql-prod

volumes:
  pgdata:
  mssqldata:
