services:
  postgres:
    image: postgres:16-alpine
    container_name: cdmp-postgres
    environment:
      POSTGRES_DB: cdmp_dev
      POSTGRES_USER: cdmp
      POSTGRES_PASSWORD: cdmp_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdmp -d cdmp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cdmp
      DB_PASSWORD: cdmp_secret
      DB_NAME: cdmp_dev
      JWT_SECRET: cdmp-dev-jwt-secret-key-2026
      AES_ENCRYPTION_KEY: 2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2
      PORT: 3000
      # F050 v2.0 / F075 v1.4 / F076 v1.3 — E07 refactor phase 3 feature flag
      # 受保護端點：F075 寫入 + available-columns / F050 v2.0 草稿 / F076 寫入
      # 預設關閉以支援漸進 rollout（BR-10）；dev 明確啟用以使用 v1.4 dropdown 等功能
      ENABLE_E07_REFACTOR_PHASE3: "true"
      # F084 v2.0 — 個別業務比例完成後自動推進至簽核（AD-E07-19）
      # prod 預設 off（漸進 rollout / BR-16）；dev 明確啟用以測試 auto-advance 主路徑
      ENABLE_E07_AUTO_ADVANCE_TO_APPROVAL: "true"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/test:/app/test
    depends_on:
      postgres:
        condition: service_healthy

  # F098 / AD-E07-28 P1：月跑 worker 容器（pg-boss consumer + cancellation poller + orphan reaper）。
  # 與 api 同一份 apps/api 程式碼（build.context: ./apps/api，避免 entity drift），
  # 共用相同 DB / AES / feature-flag env；worker entrypoint 不掛 HTTP server、不 expose port（AC-8）。
  worker:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-worker
    command: npx ts-node -r tsconfig-paths/register src/worker-main.ts
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cdmp
      DB_PASSWORD: cdmp_secret
      DB_NAME: cdmp_dev
      AES_ENCRYPTION_KEY: 2cb10a653df8e0049caaf35dbc02aa80a18a56e8d7b2383ab6aa6a069b3192f2
      # worker 才是真正執行 pipeline 者（AC-8 / TS-F098-WORKER-003）
      ENABLE_E07_REFACTOR_PHASE3: "true"
      ENABLE_E07_AUTO_ADVANCE_TO_APPROVAL: "true"
      # Bug A 修復（AD-E07-28）：PG 一律走 v2 SQL 下推（gate = DB_TYPE='postgres'）→ 真實計分。
      #   ASSIGNMENT_PIPELINE_V2 對 PG 已無意義（僅非 PG in-memory 路徑用於選 v1/v2），故此處不設。
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/test:/app/test
    depends_on:
      postgres:
        condition: service_healthy
    # 刻意無 ports：worker 不對外提供 HTTP（AC-8 / TS-F098-WORKER-001）

  web:
    build:
      context: ./apps/web
      target: dev
    container_name: cdmp-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api:3000
    volumes:
      - ./apps/web/src:/app/src
      - ./packages/shared:/packages/shared
    depends_on:
      - api

  seed:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-seed
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cdmp
      DB_PASSWORD: cdmp_secret
      DB_NAME: cdmp_dev
    command: npx ts-node -r tsconfig-paths/register src/database/seeds/seed.ts
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - seed

  # E07 計分卡 6 表初始化 + F075/F076 篩選欄位白名單 seed migration（冪等）
  # 流程：(1) typeorm migration:run — 套用所有未跑的 schema/seed migration（含 m22 / m24 / m28
  #        F075 v1.4.6 5 欄對齊）；(2) prod-data-seed — ob_levelcard 6 表初始化
  # 用法：docker compose --profile data-seed up data-seed
  data-seed:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-data-seed
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cdmp
      DB_PASSWORD: cdmp_secret
      DB_NAME: cdmp_dev
    command:
      - sh
      - -c
      - "npm run migration:run && npx ts-node -r tsconfig-paths/register src/database/seeds/prod-data-seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - data-seed

volumes:
  pgdata:
