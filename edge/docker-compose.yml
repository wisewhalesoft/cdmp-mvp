# 專職前門反向代理（edge）：獨佔 80/443、SSL 終結、依 Host 分流到各站後端。
# 直接接上「各站 compose 的既有網路」，故各站 compose 不用改（edge 純加法）。
#
# 部署順序（正式機）：
#   docker compose up -d --build                       # 先起 CDMP（建立 cdmp-mvp_default 網路）
#   docker compose -f edge/docker-compose.yml up -d     # 再起 edge（80/443）
#
# 憑證：掛載 repo 的 ../certs（已 gitignore；私鑰不入版控）。
# 新站：conf.d/ 加一個 <站台>.conf（server_name + 後端容器名），並在下方 networks 加該站的 <專案>_default。

services:
  edge:
    image: nginx:alpine
    container_name: edge-nginx
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ../certs:/etc/nginx/certs:ro
    networks:
      - cdmp

networks:
  # 接上 CDMP compose 的預設網路（讓 edge 連得到 cdmp-web / cdmp-api）。
  # 名稱 = <compose 專案目錄名>_default；本 repo 目錄 cdmp-mvp → cdmp-mvp_default。
  cdmp:
    external: true
    name: cdmp-mvp_default
