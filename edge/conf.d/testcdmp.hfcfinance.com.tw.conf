# 站台：CDMP（testcdmp.hfcfinance.com.tw）
# edge 於 443 終結 SSL（wildcard 憑證），依 Host 路由：/api → cdmp-api、其餘 → cdmp-web(Vite)。
# 未來新站：複製本檔改 server_name + 後端容器名，並讓該站容器一起接上 edge 網路即可。

# HTTP → HTTPS 轉址
server {
    listen 80;
    server_name testcdmp.hfcfinance.com.tw;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name testcdmp.hfcfinance.com.tw;

    # wildcard *.hfcfinance.com.tw fullchain + 私鑰（由 ../certs 掛載）
    ssl_certificate     /etc/nginx/certs/2026/STAR_hfcfinance.com.tw.pem;
    ssl_certificate_key /etc/nginx/certs/2026/STAR_hfcfinance.com.tw.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50m;

    # docker 內建 DNS + 變數 proxy_pass → 後端容器重啟換 IP 也不卡舊 IP（避免 502）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- API → NestJS（保留完整 /api/v1 路徑）----
    location /api/ {
        set $upstream_api cdmp-api;
        proxy_pass http://$upstream_api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA + HMR → Vite ----
    location / {
        set $upstream_web cdmp-web;
        proxy_pass http://$upstream_web:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
