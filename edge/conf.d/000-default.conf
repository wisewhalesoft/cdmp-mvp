# 預設 server（catch-all）：擋掉未知 Host —— 含以 IP 直連（如 http://172.20.x.x/）。
# 背景：nginx 對「Host 不匹配任何 server_name」的請求會落到該 port 的 default server；
#       原本 conf.d 只有 testcdmp 一個站，等於它兼任 default → IP 直連也被導進 CDMP。
# 本檔明確標 default_server，讓未知 Host 在這裡被拒絕，各站只服務自己的 server_name。

server {
    listen 80 default_server;
    server_name _;
    # 444 = nginx 特殊碼：不回應、直接斷線
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    # 不需憑證即拒絕 TLS 握手（nginx 1.19.4+）：
    # IP 直連（無 SNI）或未知 SNI 一律在握手階段拒絕，不會出現憑證警告後看到站台的情形。
    ssl_reject_handshake on;
}
