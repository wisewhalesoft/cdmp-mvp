  <script>
    let currentRole = 'admin';
    let currentCustomerType = 'individual'; // or 'corporate'

    // --- Masking functions ---
    function maskId(val) {
      if (!val) return '\u2014';
      if (val.length <= 5) return val;
      return val.substring(0, 3) + '*'.repeat(val.length - 5) + val.substring(val.length - 2);
    }
    function maskPhone(val) {
      if (!val) return '\u2014';
      if (val.length <= 6) return val;
      return val.substring(0, 4) + '*'.repeat(val.length - 6) + val.substring(val.length - 2);
    }
    function maskEmail(val) {
      if (!val) return '\u2014';
      const parts = val.split('@');
      if (parts.length !== 2) return val;
      const local = parts[0];
      const masked = local.substring(0, 2) + '*'.repeat(Math.max(local.length - 2, 2));
      return masked + '@' + parts[1];
    }
    function fmt(val) { return val == null || val === '' ? '\u2014' : val; }
    function fmtCodeDesc(code, desc) {
      if (desc && code) return `${desc}（${code}）`;
      if (desc) return desc;
      if (code) return code;
      return '\u2014';
    }
    function fmtNumber(val) {
      if (val == null) return '\u2014';
      return Number(val).toLocaleString('zh-TW');
    }
    function fmtDate(val) {
      if (!val) return '\u2014';
      const d = new Date(val);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function fmtDateTime(val) {
      if (!val) return '\u2014';
      const d = new Date(val);
      // Convert to UTC+8
      const utc8 = new Date(d.getTime() + 8 * 60 * 60 * 1000);
      const y = utc8.getUTCFullYear();
      const m = String(utc8.getUTCMonth() + 1).padStart(2, '0');
      const day = String(utc8.getUTCDate()).padStart(2, '0');
      const h = String(utc8.getUTCHours()).padStart(2, '0');
      const min = String(utc8.getUTCMinutes()).padStart(2, '0');
      return `${y}-${m}-${day} ${h}:${min}`;
    }

    // Flag badge
    function fmtFlag(val, label) {
      if (val === 'Y') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium rounded-full bg-amber-100 text-amber-800"><i data-lucide="alert-triangle" class="w-3 h-3"></i>${label}</span>`;
      }
      return fmt(val);

    function getData() {
      return currentCustomerType === 'corporate' ? corporateData : individualData;
    }

    // --- Build categories ---
    function buildCategories() {
      const d = getData();
      const isUser = currentRole === 'user';
      const isCorporate = d.identity.customerTypeCode === '02';

      const categories = [
        {
          id: 'A', title: 'A. 識別與分類', icon: 'fingerprint',
          fields: [
            ['客戶 ID', d.customerId],
            ['客戶編號', isUser ? maskId(d.identity.sourceCustomerNo) : d.identity.sourceCustomerNo],
            ['客戶類型', fmtCodeDesc(d.identity.customerTypeCode, d.identity.customerTypeDesc)],
            ['姓名/企業名稱', fmt(d.identity.name)],
            ['英文姓名', fmt(d.identity.englishName)],
          ]
        },
        {
          id: 'B', title: 'B. 個人屬性', icon: 'user-circle',
          fields: [
            ['性別', d.personalAttributes.gender === 'M' ? '男' : d.personalAttributes.gender === 'F' ? '女' : fmt(d.personalAttributes.gender)],
            ['生日', fmtDate(d.personalAttributes.dateOfBirth)],

            ['駕照號碼', fmt(d.personalAttributes.driverLicense)],
          ]
        },
        {
          id: 'C', title: 'C. 聯絡資訊', icon: 'phone',
          fields: [
            ['行動電話', isUser ? maskPhone(d.contactInfo.mobilePhone) : fmt(d.contactInfo.mobilePhone)],
            ['戶籍電話', isUser ? maskPhone(d.contactInfo.homePhone) : fmt(d.contactInfo.homePhone)],
            ['通訊電話', isUser ? maskPhone(d.contactInfo.contactPhone) : fmt(d.contactInfo.contactPhone)],
            ['公司電話', isUser ? maskPhone(d.contactInfo.officePhone) : fmt(d.contactInfo.officePhone)],

        {

        },
        {
          id: 'E', title: 'E. 職業與就業', icon: 'briefcase',
          fields: [
            ['服務公司', fmt(d.employment.companyName)],
            ['職業', fmtCodeDesc(d.employment.occupationCode, d.employment.occupationDesc)],
            ['職稱', fmtCodeDesc(d.employment.jobTitleCode, d.employment.jobTitleDesc)],
            ['職級', fmtCodeDesc(d.employment.jobLevelCode, d.employment.jobLevelDesc)],
            ['行業', fmtCodeDesc(d.employment.industryCode, d.employment.industryDesc)],
            ['年資', d.employment.workYears != null ? d.employment.workYears + ' 年' : '\u2014'],
            ['公司規模', fmt(d.employment.companyScale)],
            ['客戶角色', fmt(d.employment.role)],
          ]
        },
        {
          id: 'F', title: 'F. 財務與風控', icon: 'shield-alert',
          fields: [
            ['月所得', fmtCodeDesc(d.financial.monthlyIncomeCode, d.financial.monthlyIncomeDesc)],
            ['認定月收入', fmtNumber(d.financial.approvedIncome)],
            ['收入來源', fmtCodeDesc(d.financial.incomeSourceCode, d.financial.incomeSourceDesc)],
            ['實收資本額', fmtNumber(d.financial.capital)],
            ['額度總額', fmtNumber(d.financial.creditLimit)],
            ['最高往來金額', fmtNumber(d.financial.highestTransactionAmount)],
            ['最高往來日期', fmtDate(d.financial.highestTransactionDate)],
            ['自有不動產', fmt(d.financial.hasRealEstate)],
            ['消債旗標', '__FLAG__', d.financial.debtFlag, '消債註記'],
            ['違規欠稅旗標', '__FLAG__', d.financial.fineFlag, '罰鍰註記'],
            ['地址異常註記', fmt(d.financial.addressAnomalyFlag)],
            ['大陸籍旗標', fmt(d.financial.mainlandFlag)],
          ]
        },
        {
          id: 'G', title: 'G. 企業客戶專屬', icon: 'building',
          isCorporateOnly: true,
          fields: isCorporate && d.corporate ? [
            ['負責人姓名', fmt(d.corporate.ownerName)],
            ['負責人身分證', fmt(d.corporate.ownerId)],
            ['負責人生日', fmtDate(d.corporate.ownerBirth)],
            ['負責人郵遞區號', fmt(d.corporate.ownerZip)],
            ['負責人地址', fmt(d.corporate.ownerAddress)],
            ['登記資本額', fmtNumber(d.corporate.establishedCapital)],
            ['員工人數', fmtCodeDesc(d.corporate.employeeCountCode, d.corporate.employeeCountDesc)],
            ['上市櫃', fmtCodeDesc(d.corporate.isListedCode, d.corporate.isListedDesc)],
            ['集團實際負責人', fmt(d.corporate.groupOwner)],
            ['營業項目', fmt(d.corporate.businessItem)],
            ['組織形態', fmt(d.corporate.organizationType)],
            ['母公司客戶 ID', fmt(d.corporate.parentCustomerId)],
            ['母公司名稱', fmt(d.corporate.parentCustomerName)],
          ] : []
        },
        {
          id: 'H', title: 'H. 稽核與 ETL 追蹤', icon: 'file-clock',
          fields: [
            ['來源建檔日期', fmtDateTime(d.etlTracking.sourceCreatedAt)],
            ['來源最後更新', fmtDateTime(d.etlTracking.sourceUpdatedAt)],
            ['資料來源', fmt(d.etlTracking.dataSource)],
            ['ETL 載入時間', fmtDateTime(d.etlTracking.etlLoadedAt)],
            ['Pipeline ID', fmt(d.etlTracking.etlPipelineId)],
          ]
        }
      ];

      return categories;
    }

    function renderCategories() {
      const container = document.getElementById('categories-container');
      const categories = buildCategories();
      const d = getData();
      const isCorporate = d.identity.customerTypeCode === '02';

      container.innerHTML = categories.map((cat, idx) => {
        // G category: show "not applicable" for non-corporate
        if (cat.isCorporateOnly && !isCorporate) {
          return `
            <div class="bg-white rounded-lg border border-border">
              <button onclick="toggleAccordion('cat-${cat.id}')" class="w-full flex items-center justify-between px-5 py-4 hover:bg-gray-50 transition">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
                    <i data-lucide="${cat.icon}" class="w-4 h-4 text-gray-500"></i>
                  </div>
                  <h3 class="text-sm font-semibold text-gray-700">${cat.title}</h3>
                </div>
                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 accordion-arrow" id="arrow-cat-${cat.id}"></i>
              </button>
              <div class="accordion-content" id="cat-${cat.id}">
                <div class="px-5 pb-4">
                  <div class="flex items-center gap-2 py-6 justify-center text-gray-400">
                    <i data-lucide="info" class="w-4 h-4"></i>
                    <span class="text-sm">本分類不適用</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // Render field grid
        const fieldRows = cat.fields.map(f => {
          let value;
          if (f[1] === '__FLAG__') {
            value = fmtFlag(f[2], f[3]);
          } else {
            value = f[1];
          }
          return `
            <div class="grid grid-cols-3 gap-4 py-2.5 border-b border-gray-50 last:border-0">
              <dt class="text-sm text-gray-500">${f[0]}</dt>
              <dd class="text-sm text-gray-900 col-span-2 font-mono text-xs break-all">${value}</dd>
            </div>
          `;
        }).join('');

        const fieldCount = cat.fields.length;
        const defaultOpen = idx < 3; // Open first 3 by default

        return `
          <div class="bg-white rounded-lg border border-border">
            <button onclick="toggleAccordion('cat-${cat.id}')" class="w-full flex items-center justify-between px-5 py-4 hover:bg-gray-50 transition">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                  <i data-lucide="${cat.icon}" class="w-4 h-4 text-primary"></i>
                </div>
                <h3 class="text-sm font-semibold text-gray-700">${cat.title}</h3>
                <span class="text-xs text-gray-400">${fieldCount} 個欄位</span>
              </div>
              <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 accordion-arrow ${defaultOpen ? 'open' : ''}" id="arrow-cat-${cat.id}"></i>
            </button>
            <div class="accordion-content ${defaultOpen ? 'open' : ''}" id="cat-${cat.id}">
              <div class="px-5 pb-4">
                <dl>${fieldRows}</dl>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function toggleAccordion(id) {
      const content = document.getElementById(id);
      const arrow = document.getElementById('arrow-' + id);
      content.classList.toggle('open');
      arrow.classList.toggle('open');
    }

    function updateHeader() {
      const d = getData();
      const isUser = currentRole === 'user';
      document.getElementById('customer-name').textContent = d.identity.name;
      document.getElementById('breadcrumb-name').textContent = d.identity.name;
      document.getElementById('customer-id-display').textContent = isUser ? maskId(d.identity.sourceCustomerNo) : d.identity.sourceCustomerNo;

      const typeBadge = document.getElementById('customer-type-badge');
      const typeStyles = { '01': 'bg-blue-100 text-blue-700', '02': 'bg-green-100 text-green-700', '04': 'bg-purple-100 text-purple-700' };
      const typeLabels = { '01': '個人', '02': '企業', '04': '外籍' };
      typeBadge.className = 'inline-flex px-2.5 py-0.5 text-xs font-medium rounded-full ' + (typeStyles[d.identity.customerTypeCode] || 'bg-gray-100 text-gray-700');
      typeBadge.textContent = typeLabels[d.identity.customerTypeCode] || d.identity.customerTypeCode;

      // Avatar icon
      const avatarIcon = document.getElementById('avatar-icon');
      avatarIcon.setAttribute('data-lucide', d.identity.customerTypeCode === '02' ? 'building-2' : 'user');
      lucide.createIcons();
    }

    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.className = 'role-btn px-3 py-1 text-xs font-medium rounded-md transition ' +
          (btn.id === 'role-' + role ? 'bg-white text-primary shadow-sm' : 'text-gray-500');
      });
      updateHeader();
      renderCategories();
    }

    function showCustomer(type) {
      currentCustomerType = type;
      document.querySelectorAll('.demo-type-btn').forEach(btn => {
        btn.className = 'demo-type-btn px-2 py-1 text-xs font-medium rounded-md transition ' +
          (btn.id === 'demo-' + type ? 'bg-white text-primary shadow-sm' : 'text-gray-500');
      });
      updateHeader();
      renderCategories();
    }

    function showView(view) {
      document.querySelectorAll('.demo-btn').forEach(btn => {
        const match = (view === 'normal' && btn.textContent.includes('正常')) ||
                      (view === 'stale' && btn.textContent.includes('過期')) ||
                      (view === 'not-found' && btn.textContent.includes('404'));
        btn.className = 'demo-btn px-3 py-1 text-xs rounded border ' +
          (match ? 'border-primary bg-blue-50 text-primary' : 'border-gray-300 bg-white hover:bg-gray-50');
      });

      document.getElementById('view-normal').classList.toggle('hidden', view === 'not-found');
      document.getElementById('view-not-found').classList.toggle('hidden', view !== 'not-found');
      document.getElementById('freshness-warning').classList.toggle('hidden', view !== 'stale');
    }

    // Init
    updateHeader();
    renderCategories();
    lucide.createIcons();
  </script>
  <script>
    // ===== Sidebar collapsible：客戶名單分派 =====
    (function() {
      const assignmentPages = [
        '27-list-definition.html', '28-scoring-config.html', '30-stage0-estimate.html', '31-trigger-run.html', '32-run-progress.html',
        '33-run-summary.html', '34-run-history.html', '35-snapshot-detail.html',
        '36-run-compare.html', '37-base-code.html'
      ];
      const currentPage = (location.pathname.split('/').pop() || '').toLowerCase();
      const isAssignmentPage = assignmentPages.includes(currentPage);

      window.toggleAssignmentSection = function() {
        const header = document.getElementById('assignment-section-header');
        const expanded = header.getAttribute('aria-expanded') === 'true';
        setAssignmentExpanded(!expanded, true);
      };

      function setAssignmentExpanded(expanded, persist) {
        const section = document.getElementById('assignment-section');
        const chevron = document.getElementById('assignment-chevron');
        const header = document.getElementById('assignment-section-header');
        if (!section || !chevron || !header) return;
        if (expanded) {
          section.style.maxHeight = section.scrollHeight + 'px';
          chevron.style.transform = 'rotate(90deg)';
          header.setAttribute('aria-expanded', 'true');
        } else {
          section.style.maxHeight = '0px';
          chevron.style.transform = 'rotate(0deg)';
          header.setAttribute('aria-expanded', 'false');
        }
        if (persist) {
          localStorage.setItem('cdmp.sidebar.assignment.expanded', expanded ? '1' : '0');
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        const stored = localStorage.getItem('cdmp.sidebar.assignment.expanded');
        const shouldExpand = isAssignmentPage || stored === '1';
        setAssignmentExpanded(shouldExpand, false);
      });
    })();
  </script>
</body>
</html>
