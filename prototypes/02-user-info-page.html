<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首頁 - CDMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#2563EB', danger: '#EF4444', success: '#22C55E', warning: '#F59E0B', unknown: '#9CA3AF', surface: '#FFFFFF', border: '#E5E7EB', bg: '#F9FAFB' } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-bg min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-surface border-b border-border px-6 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <div class="inline-flex items-center justify-center w-8 h-8 bg-primary rounded-lg">
        <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
      </div>
      <span class="text-lg font-bold text-gray-900">CDMP</span>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center">
          <span class="text-sm font-medium text-primary">陳</span>
        </div>
        <span class="text-sm text-gray-700 font-medium">陳小美</span>
      </div>
      <button onclick="handleLogout()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm text-gray-500 hover:text-danger rounded-lg hover:bg-red-50 transition">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>登出</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4">
        <i data-lucide="inbox" class="w-8 h-8 text-gray-400"></i>
      </div>
      <h2 class="text-lg font-medium text-gray-700 mb-2">目前尚無可用功能</h2>
      <p class="text-sm text-gray-400">請聯絡您的管理員。</p>
    </div>
  </main>

  <!-- Logout Modal -->
  <div id="logout-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
    <div class="bg-surface rounded-2xl shadow-xl border border-border p-8 max-w-sm w-full text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-green-50 rounded-full mb-4">
        <i data-lucide="check-circle" class="w-6 h-6 text-success"></i>
      </div>
      <h3 class="text-lg font-semibold text-gray-900 mb-2">已成功登出</h3>
      <p class="text-sm text-gray-500 mb-6">您已成功登出，即將導向登入頁面...</p>
      <a href="01-login.html" class="inline-flex items-center justify-center w-full bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition">
        前往登入頁面
      </a>
    </div>
  </div>

  <script>
    function handleLogout() {
      document.getElementById('logout-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    lucide.createIcons();
  </script>
</body>
</html>
