<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設連結已寄出 - CDMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#2563EB', danger: '#EF4444', success: '#22C55E', warning: '#F59E0B', unknown: '#9CA3AF', surface: '#FFFFFF', border: '#E5E7EB', bg: '#F9FAFB' } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-bg min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="bg-surface rounded-2xl shadow-lg border border-border p-8 text-center">
      <!-- Success Icon -->
      <div class="inline-flex items-center justify-center w-16 h-16 bg-green-50 rounded-full mb-5">
        <i data-lucide="mail-check" class="w-8 h-8 text-success"></i>
      </div>

      <!-- Message -->
      <h1 class="text-xl font-bold text-gray-900 mb-3">若此 Email 存在，重設連結已寄出</h1>
      <p class="text-sm text-gray-500 leading-relaxed mb-8">請檢查您的信箱，並點擊信中的連結重設密碼。重設連結有效時間為 24 小時。</p>

      <!-- Back to login -->
      <a href="01-login.html"
        class="inline-flex items-center justify-center w-full bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition">
        返回登入
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
