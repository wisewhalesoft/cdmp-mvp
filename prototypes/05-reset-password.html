<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設密碼 - CDMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#2563EB', danger: '#EF4444', success: '#22C55E', warning: '#F59E0B', unknown: '#9CA3AF', surface: '#FFFFFF', border: '#E5E7EB', bg: '#F9FAFB' } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-bg min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Expired Link State -->
    <div id="expired-state" class="hidden">
      <div class="bg-surface rounded-2xl shadow-lg border border-border p-8 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-red-50 rounded-full mb-5">
          <i data-lucide="clock" class="w-8 h-8 text-danger"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-900 mb-3">連結已過期</h1>
        <p class="text-sm text-gray-500 leading-relaxed mb-6">此連結已過期，請重新申請密碼重設。</p>
        <a href="03-forgot-password.html"
          class="inline-flex items-center justify-center w-full bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition">
          重新申請密碼重設
        </a>
      </div>
    </div>

    <!-- Normal Form State -->
    <div id="form-state">
      <div class="bg-surface rounded-2xl shadow-lg border border-border p-8">
        <!-- Header -->
        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center w-12 h-12 bg-primary/10 rounded-xl mb-4">
            <i data-lucide="lock-keyhole" class="w-6 h-6 text-primary"></i>
          </div>
          <h1 class="text-xl font-bold text-gray-900">重設密碼</h1>
        </div>

        <!-- Form -->
        <form id="reset-form" onsubmit="return false;" class="space-y-5">
          <!-- New Password -->
          <div>
            <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1.5">新密碼</label>
            <div class="relative">
              <input type="password" id="new-password" placeholder="••••••••"
                class="w-full px-3.5 py-2.5 rounded-lg border border-border text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition pr-10" />
              <button type="button" onclick="togglePassword('new-password', 'eye1', 'eyeoff1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <i data-lucide="eye" id="eye1" class="w-4 h-4"></i>
                <i data-lucide="eye-off" id="eyeoff1" class="w-4 h-4 hidden"></i>
              </button>
            </div>
            <p id="password-hint" class="mt-1.5 text-xs text-gray-400">最短長度為 8 個字元</p>
            <p id="new-password-error" class="hidden mt-1.5 text-xs text-danger">密碼長度不得少於 8 個字元</p>
          </div>

          <!-- Confirm Password -->
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1.5">確認密碼</label>
            <div class="relative">
              <input type="password" id="confirm-password" placeholder="••••••••"
                class="w-full px-3.5 py-2.5 rounded-lg border border-border text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition pr-10" />
              <button type="button" onclick="togglePassword('confirm-password', 'eye2', 'eyeoff2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <i data-lucide="eye" id="eye2" class="w-4 h-4"></i>
                <i data-lucide="eye-off" id="eyeoff2" class="w-4 h-4 hidden"></i>
              </button>
            </div>
            <p id="confirm-password-error" class="hidden mt-1.5 text-xs text-danger">密碼與確認密碼不一致</p>
          </div>

          <!-- Submit -->
          <button type="submit" id="submit-btn"
            class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
            <svg id="submit-spinner" class="hidden animate-spin w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span id="submit-btn-text">重設密碼</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Demo Controls -->
    <div class="mt-6 bg-surface rounded-xl border border-border p-4">
      <p class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-3">Demo 狀態切換</p>
      <div class="flex flex-wrap gap-2">
        <button onclick="setState('normal')" class="px-3 py-1.5 text-xs rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Normal</button>
        <button onclick="setState('validation')" class="px-3 py-1.5 text-xs rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Validation Error</button>
        <button onclick="setState('expired')" class="px-3 py-1.5 text-xs rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Expired Link</button>
        <button onclick="setState('loading')" class="px-3 py-1.5 text-xs rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Loading</button>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId, eyeId, eyeOffId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      const eyeOff = document.getElementById(eyeOffId);
      if (input.type === 'password') {
        input.type = 'text';
        eye.classList.add('hidden');
        eyeOff.classList.remove('hidden');
      } else {
        input.type = 'password';
        eye.classList.remove('hidden');
        eyeOff.classList.add('hidden');
      }
    }

    function clearState() {
      document.getElementById('new-password-error').classList.add('hidden');
      document.getElementById('confirm-password-error').classList.add('hidden');
      document.getElementById('password-hint').classList.remove('hidden');
      document.getElementById('new-password').classList.remove('border-danger');
      document.getElementById('confirm-password').classList.remove('border-danger');
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('submit-spinner').classList.add('hidden');
      document.getElementById('submit-btn-text').textContent = '重設密碼';
      document.getElementById('form-state').classList.remove('hidden');
      document.getElementById('expired-state').classList.add('hidden');
    }

    function setState(state) {
      clearState();
      switch (state) {
        case 'validation':
          document.getElementById('new-password-error').classList.remove('hidden');
          document.getElementById('confirm-password-error').classList.remove('hidden');
          document.getElementById('password-hint').classList.add('hidden');
          document.getElementById('new-password').classList.add('border-danger');
          document.getElementById('confirm-password').classList.add('border-danger');
          break;
        case 'expired':
          document.getElementById('form-state').classList.add('hidden');
          document.getElementById('expired-state').classList.remove('hidden');
          lucide.createIcons();
          break;
        case 'loading':
          document.getElementById('submit-btn').disabled = true;
          document.getElementById('submit-spinner').classList.remove('hidden');
          document.getElementById('submit-btn-text').textContent = '重設中...';
          break;
      }
    }

    lucide.createIcons();
  </script>
</body>
</html>
