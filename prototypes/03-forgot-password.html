<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘記密碼 - CDMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#2563EB', danger: '#EF4444', success: '#22C55E', warning: '#F59E0B', unknown: '#9CA3AF', surface: '#FFFFFF', border: '#E5E7EB', bg: '#F9FAFB' } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-bg min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="bg-surface rounded-2xl shadow-lg border border-border p-8">
      <!-- Header -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-primary/10 rounded-xl mb-4">
          <i data-lucide="key-round" class="w-6 h-6 text-primary"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-900">忘記密碼</h1>
        <p class="text-sm text-gray-500 mt-2">請輸入您的 Email 地址，我們將寄送密碼重設連結給您。</p>
      </div>

      <!-- Form -->
      <form id="forgot-form" onsubmit="return false;" class="space-y-5">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" id="email" placeholder="user@example.com"
            class="w-full px-3.5 py-2.5 rounded-lg border border-border text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition" />
          <p id="email-error" class="hidden mt-1.5 text-xs text-danger">請輸入有效的 Email 地址</p>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn"
          class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
          <svg id="submit-spinner" class="hidden animate-spin w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span id="submit-btn-text">發送重設連結</span>
        </button>
      </form>

      <!-- Back to login -->
      <div class="text-center mt-4">
        <a href="01-login.html" class="text-sm text-primary hover:text-primary/80 transition inline-flex items-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          返回登入
        </a>
      </div>
    </div>

    <!-- Demo Controls -->
    <div class="mt-6 bg-surface rounded-xl border border-border p-4">
      <p class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-3">Demo 狀態切換</p>
      <div class="flex flex-wrap gap-2">
        <button onclick="setState('normal')" class="px-3 py-1.5 text-xs rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Normal</button>
        <button onclick="setState('validation')" class="px-3 py-1.5 text-xs rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Validation Error</button>
        <button onclick="setState('loading')" class="px-3 py-1.5 text-xs rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition">Loading</button>
      </div>
    </div>
  </div>

  <script>
    function clearState() {
      document.getElementById('email-error').classList.add('hidden');
      document.getElementById('email').classList.remove('border-danger');
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('submit-spinner').classList.add('hidden');
      document.getElementById('submit-btn-text').textContent = '發送重設連結';
    }

    function setState(state) {
      clearState();
      switch (state) {
        case 'validation':
          document.getElementById('email-error').classList.remove('hidden');
          document.getElementById('email').classList.add('border-danger');
          break;
        case 'loading':
          document.getElementById('submit-btn').disabled = true;
          document.getElementById('submit-spinner').classList.remove('hidden');
          document.getElementById('submit-btn-text').textContent = '發送中...';
          break;
      }
    }

    lucide.createIcons();
  </script>
</body>
</html>
