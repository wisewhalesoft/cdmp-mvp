services:
  api-test:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-api-test
    environment:
      NODE_ENV: test
      # 單元測試走 SQLite in-memory（test/setup.ts 全域預設）；MSSQL 真庫驗證另由 .mssql.spec + CI mssql job 執行。
      DB_TYPE: sqlite
      JWT_SECRET: cdmp-test-jwt-secret-key
      PORT: 3001
    command: npx vitest run
    profiles:
      - unit

  api-e2e:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-api-e2e
    environment:
      NODE_ENV: test
      DB_TYPE: sqlite
      JWT_SECRET: cdmp-test-jwt-secret-key
    command: npx vitest run --config vitest.e2e.config.ts
    profiles:
      - e2e

  web-test:
    build:
      context: ./apps/web
      target: dev
    container_name: cdmp-web-test
    command: npx vitest run
    profiles:
      - unit

  test-all:
    build:
      context: ./apps/api
      target: dev
    container_name: cdmp-test-all
    environment:
      NODE_ENV: test
      DB_TYPE: sqlite
      JWT_SECRET: cdmp-test-jwt-secret-key
    command: sh -c "npx vitest run && npx vitest run --config vitest.e2e.config.ts"
    profiles:
      - all
