# CDMP 反向代理（內網網址單一入口）
# 前端同源：/api/* 直轉 NestJS(api:3000)，其餘轉前端(web:5173, Vite dev server)。
# 掛載至 nginx conf.d：docker-compose 的 nginx 服務（profile: proxy）。

# Vite HMR 需 websocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 匯入/預覽等較大請求
    client_max_body_size 50m;

    # Docker 內建 DNS（127.0.0.11）。搭配下方 proxy_pass 用「變數」→ 於每次請求時解析，
    # 使 api/web 容器重啟換 IP 後不會卡舊 IP 造成 502（對齊 restart: unless-stopped / 重開機）。
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- API → NestJS（保留完整 /api/v1/... 路徑，不改寫）----
    location /api/ {
        set $upstream_api api;
        proxy_pass http://$upstream_api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 長任務（匯出 / 大量預覽）避免過早逾時
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA + HMR → Vite dev server ----
    location / {
        set $upstream_web web;
        proxy_pass http://$upstream_web:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vite HMR websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

